name: Publish static demo to GitHub Pages
# Publishes ONLY the static synthetic-data preview (scripts/build-static-demo.ts), never the application:
# GitHub Pages cannot run the Next.js server (login, server actions, signed downloads).
on:
  push:
    branches: [main]
    paths: ["scripts/build-static-demo.ts", "src/lib/demo.ts", "src/app/globals.css", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tsx scripts/build-static-demo.ts
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist-demo }
      - id: deployment
        uses: actions/deploy-pages@v4
