name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321   # build-only dummy values, not secrets
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:db
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
